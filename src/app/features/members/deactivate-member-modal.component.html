<div
  *ngIf="visible"
  class="fixed inset-0 z-50 flex items-center justify-center bg-surface-900/50 p-4"
  role="dialog"
  aria-modal="true"
>
  <div class="w-full max-w-md rounded-2xl bg-surface-0 p-6 shadow-xl border border-surface-200">
    <div class="flex items-center justify-between border-b border-surface-200 pb-3">
      <div>
        <h3 class="text-base font-semibold text-red-700">Deactivate Staff Member</h3>
        <p class="text-xs text-surface-500">
          Member: <strong class="text-surface-800">{{ member?.display_name }}</strong>
        </p>
      </div>
      <button
        type="button"
        (click)="close()"
        class="rounded-lg p-1.5 text-surface-400 hover:bg-surface-100 hover:text-surface-700"
      >
        <span class="sr-only">Close</span>
        <i class="pi pi-times"></i>
      </button>
    </div>

    <!-- Error Banner -->
    <div
      *ngIf="errorMessage()"
      class="mt-3 rounded-lg bg-red-50 p-3 text-xs text-red-700 border border-red-200"
    >
      {{ errorMessage() }}
    </div>

    <!-- Warning Details -->
    <div
      class="mt-4 rounded-xl border border-amber-200 bg-amber-50 p-3.5 space-y-2 text-xs text-amber-800"
    >
      <div class="flex items-start gap-2">
        <i class="pi pi-exclamation-triangle text-amber-600 mt-0.5"></i>
        <div>
          <p class="font-semibold">Immediate access revocation</p>
          <p class="mt-1">
            Deactivating this staff member will take effect immediately. Any unfinished visits
            assigned to them will return to dispatch.
          </p>
        </div>
      </div>
    </div>

    <div
      *ngIf="member?.is_self"
      class="mt-3 rounded-lg bg-red-50 p-3 text-xs text-red-700 border border-red-200"
    >
      You cannot deactivate your own account.
    </div>

    <!-- Actions -->
    <div class="mt-6 flex items-center justify-end gap-2 border-t border-surface-200 pt-3">
      <button
        type="button"
        (click)="close()"
        [disabled]="isSubmitting()"
        class="rounded-full border border-surface-300 bg-surface-0 px-4 py-2 text-xs font-medium text-surface-700 hover:bg-surface-50"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="submitDeactivate()"
        [disabled]="isSubmitting() || member?.is_self"
        class="rounded-full bg-red-600 px-5 py-2 text-xs font-medium text-surface-0 hover:bg-red-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        <span *ngIf="!isSubmitting()">Confirm Deactivation</span>
        <span *ngIf="isSubmitting()">Deactivating...</span>
      </button>
    </div>
  </div>
</div>
