<div
  *ngIf="visible"
  class="fixed inset-0 z-50 flex items-center justify-center bg-surface-900/50 p-4"
  role="dialog"
  aria-modal="true"
>
  <div class="w-full max-w-lg rounded-2xl bg-surface-0 p-6 shadow-xl border border-surface-200">
    <div class="flex items-center justify-between border-b border-surface-200 pb-3">
      <div>
        <h3 class="text-base font-semibold text-surface-900">Manage Staff Roles</h3>
        <p class="text-xs text-surface-500">
          Member: <strong class="text-surface-800">{{ member?.display_name }}</strong> ({{
            member?.email
          }})
        </p>
      </div>
      <button
        type="button"
        (click)="close()"
        class="rounded-lg p-1.5 text-surface-400 hover:bg-surface-100 hover:text-surface-700"
      >
        <span class="sr-only">Close</span>
        <i class="pi pi-times"></i>
      </button>
    </div>

    <!-- Self Modification Warning -->
    <div
      *ngIf="member?.is_self"
      class="mt-3 rounded-lg bg-amber-50 p-3 text-xs text-amber-800 border border-amber-200 flex items-center gap-2"
    >
      <i class="pi pi-exclamation-triangle text-amber-600"></i>
      <span>You cannot grant or revoke roles on your own account.</span>
    </div>

    <!-- Error Banner -->
    <div
      *ngIf="errorMessage()"
      class="mt-3 rounded-lg bg-red-50 p-3 text-xs text-red-700 border border-red-200"
    >
      {{ errorMessage() }}
    </div>

    <!-- Current Roles -->
    <div class="mt-4 space-y-3">
      <label class="block text-xs font-medium text-surface-700">Currently Assigned Roles</label>
      <div
        class="flex flex-wrap gap-2 p-3 rounded-xl border border-surface-200 bg-surface-50 min-h-16 items-center"
      >
        <span
          *ngFor="let role of member?.roles"
          class="inline-flex items-center gap-1.5 rounded-full bg-surface-0 px-3 py-1 text-xs font-medium text-surface-800 border border-surface-200 shadow-sm"
        >
          <span>{{ getRoleLabel(role) }}</span>
          <button
            type="button"
            (click)="revokeRole(role)"
            [disabled]="isSubmitting() || member?.is_self"
            class="text-surface-400 hover:text-red-600 disabled:opacity-30 disabled:cursor-not-allowed"
            [title]="member?.is_self ? 'Self modification forbidden' : 'Revoke role'"
          >
            <i class="pi pi-times text-[10px]"></i>
          </button>
        </span>

        <span *ngIf="!member?.roles?.length" class="text-xs text-surface-400">
          No roles assigned.
        </span>
      </div>

      <!-- Add New Role -->
      <div *ngIf="member && !member.is_self" class="pt-2">
        <label for="newRoleSelect" class="block text-xs font-medium text-surface-700 mb-1">
          Grant Additional Role
        </label>
        <div class="flex items-center gap-2">
          <select
            id="newRoleSelect"
            [ngModel]="selectedRoleToAdd()"
            (ngModelChange)="selectedRoleToAdd.set($event)"
            [disabled]="isSubmitting() || availableRoles.length === 0"
            class="flex-1 rounded-lg border border-surface-300 bg-surface-0 p-2 text-xs text-surface-900 focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500 disabled:opacity-50"
          >
            <option value="">Select a role to grant...</option>
            <option *ngFor="let r of availableRoles" [value]="r.value">{{ r.label }}</option>
          </select>

          <button
            type="button"
            (click)="grantSelectedRole()"
            [disabled]="isSubmitting() || !selectedRoleToAdd()"
            class="inline-flex items-center gap-1 rounded-lg bg-primary-600 px-4 py-2 text-xs font-medium text-surface-0 hover:bg-primary-700 disabled:opacity-50"
          >
            <i class="pi pi-plus text-xs"></i>
            <span>Grant</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="mt-6 flex items-center justify-end border-t border-surface-200 pt-3">
      <button
        type="button"
        (click)="close()"
        class="rounded-full border border-surface-300 bg-surface-0 px-4 py-2 text-xs font-medium text-surface-700 hover:bg-surface-50"
      >
        Done
      </button>
    </div>
  </div>
</div>
