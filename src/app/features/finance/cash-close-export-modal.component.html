<div
  *ngIf="visible"
  class="fixed inset-0 z-50 flex items-center justify-center bg-surface-900/50 p-4"
  role="dialog"
  aria-modal="true"
>
  <div class="w-full max-w-md rounded-2xl bg-surface-0 p-6 shadow-xl border border-surface-200">
    <div class="flex items-center justify-between border-b border-surface-200 pb-3">
      <h3 class="text-base font-semibold text-surface-900 flex items-center gap-2">
        <i class="pi pi-download text-primary-600"></i>
        <span>Export Cash Close Data</span>
      </h3>
      <button
        type="button"
        (click)="closeModal()"
        class="rounded-lg p-1.5 text-surface-400 hover:bg-surface-100 hover:text-surface-700"
      >
        <span class="sr-only">Close</span>
        <i class="pi pi-times"></i>
      </button>
    </div>

    <!-- Error Banner -->
    <div
      *ngIf="errorMessage()"
      class="mt-3 rounded-lg bg-red-50 p-3 text-xs text-red-700 border border-red-200"
    >
      {{ errorMessage() }}
    </div>

    <div class="mt-4 space-y-4 text-xs">
      <div>
        <label for="exportDateInput" class="block font-medium text-surface-700">
          Collection Date (IST) <span class="text-red-500">*</span>
        </label>
        <input
          id="exportDateInput"
          type="date"
          [ngModel]="exportDate()"
          (ngModelChange)="exportDate.set($event)"
          [disabled]="isExporting()"
          class="mt-1 block w-full rounded-lg border border-surface-300 bg-surface-0 px-3 py-2 text-xs text-surface-900 focus:border-primary-500 focus:outline-none"
        />
      </div>

      <div>
        <span class="block font-medium text-surface-700 mb-1.5">Export Format</span>
        <div class="flex gap-4">
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              name="exportFormat"
              value="csv"
              [ngModel]="exportFormat()"
              (ngModelChange)="exportFormat.set($event)"
              [disabled]="isExporting()"
              class="text-primary-600 focus:ring-primary-500"
            />
            <span class="text-surface-800">CSV (Spreadsheet)</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              name="exportFormat"
              value="json"
              [ngModel]="exportFormat()"
              (ngModelChange)="exportFormat.set($event)"
              [disabled]="isExporting()"
              class="text-primary-600 focus:ring-primary-500"
            />
            <span class="text-surface-800">Structured JSON</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="mt-6 flex items-center justify-end gap-2 border-t border-surface-200 pt-3">
      <button
        type="button"
        (click)="closeModal()"
        [disabled]="isExporting()"
        class="rounded-full border border-surface-300 bg-surface-0 px-4 py-2 text-xs font-medium text-surface-700 hover:bg-surface-50"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="submitExport()"
        [disabled]="isExporting() || !exportDate()"
        class="rounded-full bg-primary-600 px-5 py-2 text-xs font-medium text-surface-0 hover:bg-primary-700 disabled:opacity-50"
      >
        <span *ngIf="!isExporting()">Download File</span>
        <span *ngIf="isExporting()">Generating...</span>
      </button>
    </div>
  </div>
</div>
