<div class="min-h-screen flex items-center justify-center bg-surface-50 p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-surface-200 p-8">
    <div class="text-center mb-8">
      <div
        class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-primary-100 text-primary-700 font-bold text-xl mb-3"
      >
        FL
      </div>
      <h1 class="text-2xl font-bold text-surface-900 tracking-tight">Forum Labs</h1>
      <p class="text-sm text-surface-500 mt-1">Hospital Operations & Diagnostics Admin</p>
    </div>

    @if (errorMessage()) {
      <div
        class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-sm text-red-700"
        role="alert"
      >
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-surface-700 mb-1">
          Staff Email
        </label>
        <input
          id="email"
          name="email"
          type="email"
          required
          autocomplete="username"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          placeholder="staff@forumhospital.in"
          class="w-full px-4 py-2.5 rounded-xl border border-surface-300 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-surface-700 mb-1">
          Password
        </label>
        <input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          placeholder="••••••••"
          class="w-full px-4 py-2.5 rounded-xl border border-surface-300 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm"
        />
      </div>

      <button
        type="submit"
        [disabled]="isSubmitting()"
        class="w-full py-2.5 px-4 rounded-xl font-medium text-white bg-primary-600 hover:bg-primary-700 disabled:opacity-50 transition-colors shadow-sm text-sm"
      >
        @if (isSubmitting()) {
          Signing In...
        } @else {
          Sign In
        }
      </button>
    </form>

    <div class="mt-8 text-center text-xs text-surface-400">
      Authorized staff only. Contact a super admin for credentials.
    </div>
  </div>
</div>
