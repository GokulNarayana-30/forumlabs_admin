@if (visible) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-surface-900/40 backdrop-blur-xs"
  >
    <div
      class="bg-white rounded-2xl shadow-xl border border-surface-200 w-full max-w-md overflow-hidden animate-in fade-in zoom-in-95 duration-150"
    >
      <div class="px-6 py-4 border-b border-surface-200 flex items-center justify-between">
        <h3 class="text-base font-bold text-surface-900">Assign Phlebotomist</h3>
        <button
          type="button"
          (click)="close()"
          class="text-surface-400 hover:text-surface-700 text-lg leading-none p-1"
        >
          &times;
        </button>
      </div>

      <div class="p-6 space-y-4">
        @if (order) {
          <div
            class="text-xs text-surface-600 bg-surface-50 p-3 rounded-xl border border-surface-200 space-y-1"
          >
            <div class="flex justify-between">
              <span class="font-medium text-surface-500">Booking Ref:</span>
              <span class="font-bold text-surface-900">{{ order.booking_ref }}</span>
            </div>
            <div class="flex justify-between">
              <span class="font-medium text-surface-500">Slot:</span>
              <span>{{ order.slot.slot_key }}</span>
            </div>
            <div class="flex justify-between">
              <span class="font-medium text-surface-500">Area:</span>
              <span>{{ order.address.area }}, {{ order.address.pincode }}</span>
            </div>
          </div>
        }

        @if (errorMessage()) {
          <div
            class="p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-red-700"
            role="alert"
          >
            {{ errorMessage() }}
          </div>
        }

        <div>
          <label for="phleboSelect" class="block text-xs font-semibold text-surface-700 mb-1">
            Select Active Phlebotomist
          </label>
          <select
            id="phleboSelect"
            [ngModel]="selectedPhleboId()"
            (ngModelChange)="selectedPhleboId.set($event)"
            class="w-full px-3.5 py-2.5 rounded-xl border border-surface-300 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white"
          >
            <option value="" disabled>Choose a phlebotomist...</option>
            @for (p of phlebotomists(); track p.id) {
              <option [value]="p.id">{{ p.name }} ({{ p.phone }})</option>
            }
          </select>
        </div>
      </div>

      <div
        class="px-6 py-3 bg-surface-50 border-t border-surface-200 flex items-center justify-end gap-3"
      >
        <button
          type="button"
          (click)="close()"
          class="px-4 py-2 rounded-xl text-xs font-medium text-surface-700 hover:bg-surface-200 transition-colors"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="onSubmit()"
          [disabled]="isSubmitting()"
          class="px-4 py-2 rounded-xl text-xs font-semibold text-white bg-primary-600 hover:bg-primary-700 disabled:opacity-50 transition-colors shadow-sm"
        >
          @if (isSubmitting()) {
            Assigning...
          } @else {
            Confirm Assignment
          }
        </button>
      </div>
    </div>
  </div>
}
