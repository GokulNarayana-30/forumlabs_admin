<div
  *ngIf="visible"
  class="fixed inset-0 z-50 flex items-center justify-center bg-surface-900/50 p-4"
  role="dialog"
  aria-modal="true"
>
  <div class="w-full max-w-md rounded-2xl bg-surface-0 p-6 shadow-xl border border-surface-200">
    <div class="flex items-center justify-between border-b border-surface-200 pb-4">
      <div>
        <h3 class="text-lg font-semibold text-surface-900">Slot Booking Settings</h3>
        <p class="text-xs text-surface-500">
          Configure global lead time for customer slot bookings
        </p>
      </div>
      <button
        type="button"
        (click)="closeModal()"
        class="rounded-lg p-1.5 text-surface-400 hover:bg-surface-100 hover:text-surface-700"
      >
        <span class="sr-only">Close</span>
        <i class="pi pi-times text-base"></i>
      </button>
    </div>

    <!-- Error Banner -->
    <div
      *ngIf="errorMessage()"
      class="mt-4 rounded-lg bg-red-50 p-3 text-sm text-red-700 border border-red-200"
    >
      {{ errorMessage() }}
    </div>

    <div class="mt-4 space-y-4">
      <div>
        <label for="leadTimeInput" class="block text-xs font-medium text-surface-700">
          Booking Lead Time (Minutes)
        </label>
        <input
          id="leadTimeInput"
          type="number"
          min="0"
          max="2880"
          [ngModel]="leadTimeMinutes()"
          (ngModelChange)="leadTimeMinutes.set($event)"
          [disabled]="isSubmitting()"
          class="mt-1 block w-full rounded-lg border border-surface-300 bg-surface-0 px-3 py-2 text-sm text-surface-900 focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500 disabled:bg-surface-100"
        />
        <p class="mt-1.5 text-xs text-primary-700 font-medium">
          {{ getHumanReadableHint(leadTimeMinutes()) }}
        </p>
        <p class="mt-1 text-xs text-surface-500">
          Minimum advance notice required before a slot start time. Max 2880 mins (48 hours).
        </p>
      </div>
    </div>

    <!-- Actions -->
    <div class="mt-6 flex items-center justify-end gap-2 border-t border-surface-200 pt-4">
      <button
        type="button"
        (click)="closeModal()"
        [disabled]="isSubmitting()"
        class="rounded-full border border-surface-300 bg-surface-0 px-4 py-2 text-xs font-medium text-surface-700 hover:bg-surface-50"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="saveSettings()"
        [disabled]="isSubmitting()"
        class="rounded-full bg-primary-600 px-5 py-2 text-xs font-medium text-surface-0 hover:bg-primary-700 disabled:opacity-50"
      >
        <span *ngIf="!isSubmitting()">Save Settings</span>
        <span *ngIf="isSubmitting()">Saving...</span>
      </button>
    </div>
  </div>
</div>
