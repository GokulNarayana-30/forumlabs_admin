<div class="min-h-screen flex flex-col bg-surface-50">
  <!-- Topbar -->
  <header
    class="h-16 bg-white border-b border-surface-200 px-6 flex items-center justify-between sticky top-0 z-20"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-8 h-8 rounded-lg bg-primary-600 text-white flex items-center justify-center font-bold text-sm"
      >
        FL
      </div>
      <div>
        <span class="font-bold text-surface-900 tracking-tight text-lg">Forum Labs</span>
        <span class="ml-2 text-xs font-medium text-surface-500 uppercase tracking-wider"
          >Operations</span
        >
      </div>
    </div>

    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <span class="text-sm font-medium text-surface-800">
          {{ displayName() || currentUser()?.email }}
        </span>
        <div class="flex items-center gap-1">
          @for (role of roles(); track $index) {
            <span
              class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-primary-50 text-primary-700 border border-primary-200"
            >
              {{ role }}
            </span>
          }
        </div>
      </div>

      <button
        type="button"
        data-testid="sign-out-btn"
        (click)="signOut()"
        class="text-xs font-medium text-surface-600 hover:text-surface-900 px-3 py-1.5 rounded-lg border border-surface-300 hover:bg-surface-100 transition-colors"
      >
        Sign Out
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-surface-200 flex flex-col p-4 shrink-0">
      <nav class="space-y-1">
        @for (item of navItems(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-primary-50 text-primary-700 font-semibold"
            class="flex items-center px-3 py-2 rounded-xl text-sm font-medium text-surface-700 hover:bg-surface-100 hover:text-surface-900 transition-colors"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet />
    </main>
  </div>
</div>
