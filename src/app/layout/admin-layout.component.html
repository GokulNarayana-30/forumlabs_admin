<div class="min-h-screen flex flex-col bg-surface-50">
  <!-- Topbar -->
  <header
    class="h-16 bg-white border-b border-surface-200 px-3 md:px-6 flex items-center justify-between gap-2 sticky top-0 z-30"
  >
    <div class="flex items-center gap-2 md:gap-3 min-w-0">
      <!-- Menu button: phones only (the menu is always visible from the md width up) -->
      <button
        type="button"
        data-testid="menu-btn"
        class="md:hidden shrink-0 w-10 h-10 rounded-lg border border-surface-300 text-surface-700 hover:bg-surface-100 flex items-center justify-center text-lg"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="main-menu"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
        (click)="menuOpen.set(!menuOpen())"
      >
        {{ menuOpen() ? '✕' : '☰' }}
      </button>
      <div
        class="shrink-0 w-8 h-8 rounded-lg bg-primary-600 text-white flex items-center justify-center font-bold text-sm"
      >
        FL
      </div>
      <div class="min-w-0 whitespace-nowrap">
        <span class="font-bold text-surface-900 tracking-tight text-base md:text-lg"
          >Forum Labs</span
        >
        <span
          class="hidden sm:inline ml-2 text-xs font-medium text-surface-500 uppercase tracking-wider"
          >Operations</span
        >
      </div>
    </div>

    <div class="flex items-center gap-2 md:gap-4 min-w-0">
      <div class="flex items-center gap-2 min-w-0">
        <span class="hidden sm:inline truncate max-w-[10rem] text-sm font-medium text-surface-800">
          {{ displayName() || currentUser()?.email }}
        </span>
        <div class="hidden md:flex items-center gap-1">
          @for (role of roles(); track $index) {
            <span
              class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-primary-50 text-primary-700 border border-primary-200"
            >
              {{ role }}
            </span>
          }
        </div>
      </div>

      <button
        type="button"
        data-testid="sign-out-btn"
        (click)="signOut()"
        class="shrink-0 whitespace-nowrap text-xs font-medium text-surface-600 hover:text-surface-900 px-3 py-1.5 rounded-lg border border-surface-300 hover:bg-surface-100 transition-colors"
      >
        Sign Out
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden relative">
    <!-- Phones: a dark layer behind the open menu; a tap on it closes the menu -->
    @if (menuOpen()) {
      <div
        class="md:hidden fixed inset-0 top-16 z-10 bg-surface-900/40"
        data-testid="menu-backdrop"
        (click)="menuOpen.set(false)"
        aria-hidden="true"
      ></div>
    }

    <!-- Menu: a slide-in panel on phones, a fixed column from the md width up -->
    <aside
      id="main-menu"
      [class]="
        'bg-white border-r border-surface-200 flex-col p-4 shrink-0 w-64 md:flex md:static md:z-auto ' +
        (menuOpen() ? 'flex fixed top-16 bottom-0 left-0 z-20 shadow-xl' : 'hidden')
      "
    >
      <nav class="space-y-1 overflow-y-auto">
        @for (item of navItems(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-primary-50 text-primary-700 font-semibold"
            (click)="menuOpen.set(false)"
            class="flex items-center px-3 py-2.5 rounded-xl text-sm font-medium text-surface-700 hover:bg-surface-100 hover:text-surface-900 transition-colors"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 min-w-0 overflow-y-auto p-3 md:p-6">
      <router-outlet />
    </main>
  </div>
</div>
